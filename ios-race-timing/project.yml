name: Zeitnahme
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  TimingCore:
    path: .
targets:
  Zeitnahme:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: TimingCore
    info:
      path: build/Zeitnahme-Info.plist
      properties:
        CFBundleDisplayName: JAuswertung Zeitnahme
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Die App verbindet sich mit deinem Wettkampftisch im lokalen Netzwerk.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.df.jauswertung.zeitnahme.ios
        TARGETED_DEVICE_FAMILY: "1"
  ZeitnahmeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Zeitnahme
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: de.df.jauswertung.zeitnahme.ios.uitests
schemes:
  Zeitnahme:
    build:
      targets:
        Zeitnahme: all
        ZeitnahmeUITests: [test]
    test:
      targets: [ZeitnahmeUITests]
